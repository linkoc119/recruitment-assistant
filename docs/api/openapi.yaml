              text:
                type: string
            required: [segment_id, page, paragraph, start_offset, end_offset, text]
      required: [resume_id, snapshot_id, run_id, result_id, raw_text, segments]
      description: Plain text preview for PDF/DOCX; never executable HTML. Source matches frozen snapshot; no contact details in URL.
    DecisionInput:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [shortlisted, rejected]
        expected_result_version:
          $ref: '#/components/schemas/Version'
