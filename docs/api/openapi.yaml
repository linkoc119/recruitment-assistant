    SuggestionInput:
      type: object
      additionalProperties: false
      properties:
        expected_job_version:
          $ref: '#/components/schemas/Version'
      required: [expected_job_version]
    RankingQuery:
      type: object
      additionalProperties: false
      properties:
        run_id:
          $ref: '#/components/schemas/Id'
        decision_epoch:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        search:
          type: string
          maxLength: 200
        passed_mandatory:
          type: boolean
        decision:
          $ref: '#/components/schemas/DecisionStatus'
      description: "Body-only search with run/decision-epoch pagination. See README section 10 for page consistency rules."
      example:
        run_id: '31'
        decision_epoch: 0
        offset: 0
        limit: 50
    SnapshotCandidate:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
      required: [id, full_name, email, phone]
      description: Display/contact facts captured for this immutable CV snapshot; never current candidate metadata.
    NullableId:
      type: string
      pattern: ^[1-9][0-9]*$
      example: '42'
      description: Positive database bigint encoded as a decimal string to avoid JavaScript precision loss.
      nullable: true
    NullableDecimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      example: '92.94'
      description: Non-negative decimal string; do not use binary floating point for authoritative calculations.
      nullable: true
    Timestamp:
      type: string
      format: date-time
      example: '2026-09-16T09:00:00Z'
    NullableTimestamp:
      type: string
      format: date-time
      example: '2026-09-16T09:00:00Z'
      nullable: true
    JobStatus:
      type: string
      enum: [draft, open, closed]
    DecisionStatus:
      type: string
      enum: [scored, shortlisted, rejected]
    ResumeStatus:
      type: string
      enum: [uploaded, parsing, parsed, parse_failed]
  parameters:
    job_id:
      name: job_id
      in: path
      required: true
      description: Server-issued identifier, validated against parent context.
      schema:
        $ref: '#/components/schemas/Id'
    resume_id:
      name: resume_id
      in: path
      required: true
      description: Server-issued identifier, validated against parent context.
      schema:
        $ref: '#/components/schemas/Id'
    run_id:
      name: run_id
      in: path
      required: true
      description: Server-issued identifier, validated against parent context.
      schema:
        $ref: '#/components/schemas/Id'
    result_id:
      name: result_id
      in: path
      required: true
      description: Server-issued identifier, validated against parent context.
      schema:
        $ref: '#/components/schemas/Id'
    revision:
      name: revision
      in: path
      required: true
      description: Immutable approved revision number within this position.
      schema:
        $ref: '#/components/schemas/Version'
    offset:
      name: offset
      in: query
      description: Zero-based offset. Non-ranking collections are live and may change between requests.
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    key:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key scoped to operation and position. Same normalized payload returns same outcome; changed payload is 409. Never include personal data.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        example: d614c3e5-8c8c-4f68-a201-cf09b5da11aa
  responses:
    '400':
      description: Malformed JSON/multipart, unknown parameter or invalid cursor.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Resource missing or mismatched position/run/result context. Do not disclose other-position existence.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Stale version, active run, idempotency mismatch, final decision or changed page snapshot. No conflicting write.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '413':
      description: 'More than 200 files: reject entire batch before acceptance; proxy request too large.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '415':
      description: Unsupported request Content-Type.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Validation or business prerequisite failure. Field errors contain no submitted sensitive values.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Rate limited. Retry with backoff and the same idempotency key.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Unexpected failure; return safe correlation details only.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: Storage/database/provider temporarily unavailable or request outcome unknown. Retry safely.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    JobResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Job'
      description: Successful response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    CriteriaDraftResponse:
      content:
        application/json:
