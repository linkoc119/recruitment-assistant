                items:
                  $ref: '#/components/schemas/Evidence'
            required: [criterion, match_status, criterion_passed, reason_code, reason, score_contribution, displayed_contribution, evidence]
      required: [id, job_id, run_id, resume_id, snapshot_id, criteria_revision, resume_version, candidate, policy_version, result_version, status, decision_at, is_current, can_decide, rank, passed_mandatory, total_score, displayed_total, skill_score, experience_score, education_score, semantic_score, summary, experience, criteria]
    SourcePreview:
      type: object
