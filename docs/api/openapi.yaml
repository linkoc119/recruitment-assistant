          $ref: '#/components/schemas/Id'
        run_id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [shortlisted, rejected]
        result_version:
          $ref: '#/components/schemas/Version'
        decision_at:
          $ref: '#/components/schemas/Timestamp'
      required: [result_id, run_id, status, result_version, decision_at]
