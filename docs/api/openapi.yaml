      description: Successful response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    CriteriaRevisionResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CriteriaRevision'
      description: Successful response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    ResumeResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resume'
      description: Successful response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    RunResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Run'
      description: Successful response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
  headers:
    CacheControl:
      description: Required for all responses, including errors and files.
      schema:
        type: string
        enum: [no-store]
    XRequestId:
      description: Correlation ID without sensitive data.
      schema:
        type: string
    ContentDisposition:
      description: inline for PDF, attachment for DOCX; safe generic filename without personal data.
      schema:
        type: string
    XContentTypeOptions:
      schema:
        type: string
        enum: [nosniff]
      description: Prevent MIME sniffing.
    RetryAfter:
      description: Delay in seconds.
      schema:
        type: integer
        minimum: 1
