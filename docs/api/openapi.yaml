          items:
            $ref: '#/components/schemas/Run'
        page:
          $ref: '#/components/schemas/Page'
      required: [items, page]
    RunItemList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunItem'
        page:
          $ref: '#/components/schemas/Page'
      required: [items, page]
    RevisionList:
