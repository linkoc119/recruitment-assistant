      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CriteriaRevision'
        page:
          $ref: '#/components/schemas/Page'
      required: [items, page]
    SkillList:
      type: object
      additionalProperties: false
      properties:
