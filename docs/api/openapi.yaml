          nullable: true
        passed_mandatory:
          type: boolean
          nullable: true
        status:
          type: string
          nullable: true
          enum: [scored, shortlisted, rejected, null]
      required: [present, result_id, rank, displayed_total, passed_mandatory, status]
    Comparison:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        left_run_id:
          $ref: '#/components/schemas/Id'
        right_run_id:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              resume_id:
                $ref: '#/components/schemas/Id'
              snapshot_id:
                $ref: '#/components/schemas/Id'
              left:
                $ref: '#/components/schemas/ComparisonValue'
              right:
                $ref: '#/components/schemas/ComparisonValue'
              score_delta:
                type: string
                nullable: true
                pattern: ^-?[0-9]+\.[0-9]{2}$
              rank_delta:
                type: integer
                nullable: true
              eligibility_changed:
                type: boolean
                nullable: true
            required: [resume_id, snapshot_id, left, right, score_delta, rank_delta, eligibility_changed]
        changed_criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              criterion_key:
                type: string
              change:
                type: string
                enum: [added, removed, modified]
              fields:
                type: array
                items:
                  type: string
            required: [criterion_key, change, fields]
        page:
          $ref: '#/components/schemas/Page'
      required: [job_id, left_run_id, right_run_id, items, changed_criteria, page]
      description: Align exact resume/snapshot identity, never merge by candidate ID. Right minus left deltas; absent side has present=false and all nullable values/deltas null.
    Skill:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        dictionary_version:
          type: string
      required: [id, name, aliases, dictionary_version]
    JobList:
      type: object
      additionalProperties: false
