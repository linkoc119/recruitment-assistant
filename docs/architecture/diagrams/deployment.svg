<text x="892" y="2361" fill="#494949" font-size="17" font-weight="400" text-anchor="start"><tspan x="892" dy="0">External system</tspan></text>
<text x="30" y="2393" fill="#494949" font-size="17" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Dashed arrow: connection initiation direction; labels state responsibility, protocol, and port. Solid grey frame: deployment node; dashed grey frame: execution environment.</tspan></text>
<text x="30" y="2420" fill="#494949" font-size="15" font-weight="400" text-anchor="start"><tspan x="30" dy="0">JD: job description · CV: candidate application file · Presentation style references Simon Brown&apos;s C4 examples (c4model.com).</tspan></text>
