<text x="1000" y="1230" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">Sends CV text with reduced</tspan><tspan x="1000" dy="25">identifying information</tspan></text>
<text x="1000" y="1280" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">[HTTPS :443]</tspan></text>
<rect x="205" y="1910" width="250" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="330" y="1930" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="330" dy="0">Scheduled backup</tspan></text>
<text x="330" y="1955" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="330" dy="0">[Encrypted channel]</tspan></text>
