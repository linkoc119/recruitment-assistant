<text x="98" y="1911" fill="#494949" font-size="23" font-weight="700" text-anchor="start"><tspan x="98" dy="0">Internal trial server</tspan></text>
<text x="98" y="1935" fill="#494949" font-size="15" font-weight="400" text-anchor="start"><tspan x="98" dy="0">[Deployment node · Linux VM · 4 vCPU / 8 GiB]</tspan></text>
<rect x="110" y="790" width="620" height="370" rx="12" fill="white" stroke="#494949" stroke-width="3" stroke-dasharray="9 7"/>
<text x="128" y="1121" fill="#494949" font-size="23" font-weight="700" text-anchor="start"><tspan x="128" dy="0">Backend process</tspan></text>
<text x="128" y="1145" fill="#494949" font-size="15" font-weight="400" text-anchor="start"><tspan x="128" dy="0">[Execution environment]</tspan></text>
<rect x="110" y="1200" width="620" height="370" rx="12" fill="white" stroke="#494949" stroke-width="3" stroke-dasharray="9 7"/>
<text x="128" y="1531" fill="#494949" font-size="23" font-weight="700" text-anchor="start"><tspan x="128" dy="0">Worker process</tspan></text>
<text x="128" y="1555" fill="#494949" font-size="15" font-weight="400" text-anchor="start"><tspan x="128" dy="0">[Execution environment]</tspan></text>
