<g id="WEB"><title>WEB · Web App instance</title><rect x="150" y="85" width="520" height="170" rx="7" fill="white" stroke="#146ac4" stroke-width="5"/><path d="M 150 114 H 670" stroke="#146ac4" stroke-width="5"/><circle cx="167" cy="99" r="6" fill="#146ac4"/><circle cx="187" cy="99" r="6" fill="#146ac4"/><circle cx="207" cy="99" r="6" fill="#146ac4"/></g>
<text x="410" y="150" fill="#146ac4" font-size="28" font-weight="700" text-anchor="middle"><tspan x="410" dy="0">Web App instance</tspan></text>
<text x="410" y="177" fill="#146ac4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="410" dy="0">[Container instance: HTML/CSS/JavaScript]</tspan></text>
<text x="410" y="211" fill="#146ac4" font-size="20" font-weight="400" text-anchor="middle"><tspan x="410" dy="0">Displays the interface, accepts input,</tspan><tspan x="410" dy="25">and tracks progress.</tspan></text>
<g id="EDGE"><title>EDGE · Nginx</title><rect x="140" y="530" width="520" height="200" rx="7" fill="white" stroke="#8a6a12" stroke-width="5"/></g>
<text x="400" y="568" fill="#8a6a12" font-size="28" font-weight="700" text-anchor="middle"><tspan x="400" dy="0">Nginx</tspan></text>
<text x="400" y="595" fill="#8a6a12" font-size="14" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">[Infrastructure node: reverse proxy]</tspan></text>
<text x="400" y="629" fill="#8a6a12" font-size="20" font-weight="400" text-anchor="middle"><tspan x="400" dy="0">HTTPS endpoint; serves WEB files</tspan><tspan x="400" dy="25">and forwards /api requests</tspan><tspan x="400" dy="25">to the backend.</tspan></text>
<g id="API"><title>API · Screening Backend instance</title><rect x="145" y="820" width="550" height="240" rx="7" fill="white" stroke="#146ac4" stroke-width="5"/><path d="M 164 838 l 13 9 l -13 9 M 186 858 h 20" fill="none" stroke="#146ac4" stroke-width="4"/></g>
<text x="420" y="887" fill="#146ac4" font-size="28" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">Screening Backend instance</tspan></text>
<text x="420" y="914" fill="#146ac4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">[Container instance: Next.js Route Handlers, Node.js]</tspan></text>
<text x="420" y="948" fill="#146ac4" font-size="20" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">One Node.js process; HTTP and</tspan><tspan x="420" dy="25">synchronous reads/writes.</tspan></text>
<g id="WORKER"><title>WORKER · Screening Worker instance</title><rect x="145" y="1230" width="550" height="240" rx="7" fill="white" stroke="#146ac4" stroke-width="5"/><path d="M 164 1248 l 13 9 l -13 9 M 186 1268 h 20" fill="none" stroke="#146ac4" stroke-width="4"/></g>
<text x="420" y="1297" fill="#146ac4" font-size="28" font-weight="700" text-anchor="middle"><tspan x="420" dy="0">Screening Worker instance</tspan></text>
<text x="420" y="1324" fill="#146ac4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">[Container instance: Node.js/TypeScript]</tspan></text>
<text x="420" y="1358" fill="#146ac4" font-size="20" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">A separate OS process from the backend;</tspan><tspan x="420" dy="25">claims durable work by lease.</tspan></text>
<g id="DB"><title>DB · Screening Database instance</title><path d="M 110 1633 L 110 1817 A 230 23 0 0 0 570 1817 L 570 1633 Z" fill="white" stroke="#146ac4" stroke-width="5"/><ellipse cx="340" cy="1633" rx="230" ry="23" fill="white" stroke="#146ac4" stroke-width="5"/></g>
<text x="340" y="1683" fill="#146ac4" font-size="28" font-weight="700" text-anchor="middle"><tspan x="340" dy="0">Screening Database instance</tspan></text>
<text x="340" y="1710" fill="#146ac4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="340" dy="0">[Container instance: PostgreSQL]</tspan></text>
<text x="340" y="1744" fill="#146ac4" font-size="20" font-weight="400" text-anchor="middle"><tspan x="340" dy="0">PostgreSQL · dedicated volume;</tspan><tspan x="340" dy="25">port 5432 is available only on</tspan><tspan x="340" dy="25">the server private network.</tspan></text>
<g id="FILES"><title>FILES · CV Store instance</title><path d="M 640 1633 L 668 1817 A 202 23 0 0 0 1072 1817 L 1100 1633 Z" fill="white" stroke="#146ac4" stroke-width="5"/><ellipse cx="870" cy="1633" rx="230" ry="23" fill="white" stroke="#146ac4" stroke-width="5"/></g>
<text x="870" y="1683" fill="#146ac4" font-size="28" font-weight="700" text-anchor="middle"><tspan x="870" dy="0">CV Store instance</tspan></text>
<text x="870" y="1710" fill="#146ac4" font-size="14" font-weight="400" text-anchor="middle"><tspan x="870" dy="0">[Container instance: S3-compatible storage]</tspan></text>
<text x="870" y="1744" fill="#146ac4" font-size="20" font-weight="400" text-anchor="middle"><tspan x="870" dy="0">S3-compatible service · dedicated volume;</tspan><tspan x="870" dy="25">the CV bucket is private.</tspan></text>
<g id="AI"><title>AI · AI Extraction Service</title><rect x="1320" y="1000" width="420" height="240" rx="7" fill="white" stroke="#c71025" stroke-width="5"/></g>
<text x="1530" y="1038" fill="#c71025" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1530" dy="0">AI Extraction Service</tspan></text>
<text x="1530" y="1065" fill="#c71025" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1530" dy="0">[External deployment node: HTTPS endpoint]</tspan></text>
<text x="1530" y="1099" fill="#c71025" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1530" dy="0">Operated by a vendor</tspan><tspan x="1530" dy="25">outside this deployment scope.</tspan></text>
<g id="BACKUP"><title>BACKUP · Backup store</title><path d="M 450 2023 L 478 2207 A 232 23 0 0 0 942 2207 L 970 2023 Z" fill="white" stroke="#8a6a12" stroke-width="5"/><ellipse cx="710" cy="2023" rx="260" ry="23" fill="white" stroke="#8a6a12" stroke-width="5"/></g>
<text x="710" y="2073" fill="#8a6a12" font-size="28" font-weight="700" text-anchor="middle"><tspan x="710" dy="0">Backup store</tspan></text>
<text x="710" y="2100" fill="#8a6a12" font-size="14" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">[Infrastructure node: separate from server]</tspan></text>
<text x="710" y="2134" fill="#8a6a12" font-size="20" font-weight="400" text-anchor="middle"><tspan x="710" dy="0">Database and file copies share</tspan><tspan x="710" dy="25">one recovery point; encrypted</tspan><tspan x="710" dy="25">and access restricted.</tspan></text>
<rect x="790" y="400" width="400" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="990" y="420" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">Loads static files and calls /api</tspan></text>
<text x="990" y="445" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="990" dy="0">[HTTPS :443]</tspan></text>
<rect x="580" y="735" width="400" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="780" y="755" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="780" dy="0">Forwards /api to backend</tspan></text>
<text x="780" y="780" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="780" dy="0">[HTTP loopback :8000]</tspan></text>
<rect x="-30" y="1130" width="250" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="95" y="1150" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="95" dy="0">Reads/writes and enqueues durable work</tspan></text>
<text x="95" y="1175" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="95" dy="0">[SQL/TCP :5432 · private network]</tspan></text>
<rect x="700" y="1280" width="260" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="830" y="1300" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="830" dy="0">Reads CV files</tspan></text>
<text x="830" y="1325" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="830" dy="0">[HTTPS/S3 API :443 · private network]</tspan></text>
<rect x="140" y="1520" width="220" height="81" rx="3" fill="white" fill-opacity="0.98"/>
<text x="250" y="1540" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">Claims work by lease</tspan><tspan x="250" dy="25">and writes results</tspan></text>
<text x="250" y="1590" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="250" dy="0">[SQL/TCP :5432 · private network]</tspan></text>
<rect x="605" y="1520" width="260" height="56" rx="3" fill="white" fill-opacity="0.98"/>
<text x="735" y="1540" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="735" dy="0">Stores and reads CV files</tspan></text>
<text x="735" y="1565" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="735" dy="0">[HTTPS/S3 API :443 · private network]</tspan></text>
<rect x="860" y="940" width="280" height="81" rx="3" fill="white" fill-opacity="0.98"/>
<text x="1000" y="960" fill="#494949" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">Sends JD text with reduced</tspan><tspan x="1000" dy="25">identifying information</tspan></text>
<text x="1000" y="1010" fill="#494949" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1000" dy="0">[HTTPS :443]</tspan></text>
