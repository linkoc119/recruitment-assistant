<text x="30" y="2290" fill="#494949" font-size="29" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Deployment View: JD-based CV Screening and Ranking</tspan></text>
<text x="30" y="2321" fill="#494949" font-size="18" font-weight="400" text-anchor="start"><tspan x="30" dy="0">Proposed architecture · JD-based CV screening and ranking only · Backend/AI not implemented</tspan></text>
