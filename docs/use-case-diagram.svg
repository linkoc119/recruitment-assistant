<path d="M930 764 H868 V1003 H623" fill="none" stroke="#536779" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#include)"/>
<text x="779" y="875" text-anchor="middle" font-size="12" transform="rotate(-90 779 875)">«include»</text>
<text x="887" y="875" text-anchor="middle" font-size="12" transform="rotate(-90 887 875)">«include»</text>
<text x="820" y="1090" text-anchor="middle" font-size="15">AI supports extraction; the backend validates evidence and calculates scores. Semantic scoring is not applied.</text>
<text x="820" y="1120" text-anchor="middle" font-size="14" fill="#536779">Solid: actor association. Dashed «include»: shared evaluation behavior used by both screening flows.</text>
<text x="820" y="1146" text-anchor="middle" font-size="14" fill="#536779">No separate shortlist approver or dictionary-administration screen is in v1 scope.</text>
